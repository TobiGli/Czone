<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C Zone | Colección</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body class="catalog-page">
    <nav class="site-nav" aria-label="Navegación principal">
      <div class="nav-inner">
        <a class="brand" href="/" aria-label="C Zone, inicio"><span class="brand-mark">C</span><span class="brand-name">ZONE</span></a>
        <input class="nav-toggle-input" type="checkbox" id="nav-toggle" />
        <label class="nav-toggle" for="nav-toggle" aria-label="Abrir menú"><i class="fas fa-bars"></i></label>
        <div class="nav-content">
          <div class="nav-links"><a class="nav-link" href="/">Inicio</a><a class="nav-link active" href="/coleccion">Colección</a><a class="nav-link" href="/ofertas">Ofertas</a></div>
          <div class="nav-actions"><button class="nav-action search-trigger" type="button" aria-label="Buscar"><i class="fas fa-search"></i></button><button class="nav-action favorites-trigger" type="button" aria-label="Favoritos"><i class="far fa-heart"></i></button><button class="nav-action cart-action cart-trigger" type="button" aria-label="Carrito"><i class="fas fa-shopping-bag"></i><span class="cart-count">0</span></button></div>
        </div>
      </div>
    </nav>
    <main class="catalog-main">
      <div class="catalog-heading"><p class="eyebrow">C Zone / 01</p><h1>La colección</h1><p>Prendas urbanas pensadas para moverse con vos.</p></div>
      <div class="catalog-toolbar"><span class="catalog-result-count"></span><button class="catalog-sort" type="button" data-sort="price">Ordenar por precio <i class="fas fa-arrow-down"></i></button></div>
      <section class="catalog-grid" aria-live="polite"></section>
    </main>
    <script src="/js/storefront.js" defer></script>
  </body>
</html>
